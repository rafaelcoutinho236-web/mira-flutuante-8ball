name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiraFlutuante8BallPool-projeto.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip MiraFlutuante8BallPool-projeto.zip
          cd MiraFlutuante8BallPool
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Flutuante-APK
          path: MiraFlutuante8BallPool/app/build/outputs/apk/debug/*.apk
